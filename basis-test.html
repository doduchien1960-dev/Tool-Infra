<!DOCTYPE html><html><body><div id="log"></div><script type="importmap">
{"imports":{
  "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
}}</script><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { BasisTextureLoader } from 'three/addons/loaders/BasisTextureLoader.js';
const log = (m)=>{ document.getElementById('log').innerHTML += m+'<br>'; console.log(m); };
log('start');
const renderer = new THREE.WebGLRenderer();
log('renderer ok');
const basis = new BasisTextureLoader();
basis.setTranscoderPath('https://unpkg.com/three@0.186.1/examples/jsm/libs/basis/');
basis.detectSupport(renderer);
log('basis setup ok');
const loader = new GLTFLoader();
loader.setBasisTextureLoader(basis);
log('loading glb...');
const t0 = performance.now();
loader.load('https://tool-infra.vercel.app/assets/models/B01_desk.glb',
  (g)=>{ log('SUCCESS in '+Math.round(performance.now()-t0)+'ms, meshes: '+g.scene.children.length); },
  (e)=>{ log('progress: '+JSON.stringify(e.loaded)); },
  (e)=>{ log('ERROR: '+(e.message||e)); }
);
setTimeout(()=>log('30s timeout reached'), 30000);
</script></body></html>
